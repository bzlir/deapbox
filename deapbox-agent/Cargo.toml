[package]
name = "deapbox-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
deapbox-core = { path = "../deapbox-core" }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
