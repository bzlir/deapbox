[package]
name = "deapbox-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
deapbox-core = { path = "../deapbox-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
strip-ansi-escapes = "0.2"
regex = "1"
nix = { version = "0.29", features = ["signal"] }
