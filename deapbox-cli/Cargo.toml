[package]
name = "deapbox-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "deapbox"
path = "src/main.rs"

[dependencies]
deapbox-core = { path = "../deapbox-core" }
deapbox-lark = { path = "../deapbox-lark" }
deapbox-agent = { path = "../deapbox-agent" }
deapbox-store = { path = "../deapbox-store" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
deapbox-core = { path = "../deapbox-core", features = ["test-support"] }
