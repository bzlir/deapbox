[package]
name = "deapbox-lark"
version = "0.1.0"
edition = "2021"

[dependencies]
deapbox-core = { path = "../deapbox-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json"] }
tungstenite = "0.24"
url = "2"
futures-util = "0.3"
